<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Microservices</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #21262d;
      --border:    #30363d;
      --primary:   #58a6ff;
      --text:      #c9d1d9;
      --text-dim:  #8b949e;
      --green:     #3fb950;
      --red:       #f85149;
      --yellow:    #d29922;
      --radius:    12px;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: grid;
      grid-template-rows: 56px auto 1fr auto;
    }

    /* ── HEADER ─────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
    }

    .header-title svg { color: var(--primary); }

    #status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--yellow);
    }
    .dot.ready  { background: var(--green); }
    .dot.error  { background: var(--red); }

    /* ── SUGESTÕES ───────────────────────────────────── */
    .suggestions {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .suggestions::-webkit-scrollbar { display: none; }

    .suggestions label {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color .15s, color .15s;
    }

    .chip:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* ── CHAT ────────────────────────────────────────── */
    #chat {
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 820px;
      animation: fadeIn .2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    .bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      line-height: 1.6;
      max-width: 100%;
    }

    .msg.user .bubble {
      background: #1f3a5f;
      border-color: #1f6feb;
    }

    .bubble.error {
      background: #2d1a1a;
      border-color: var(--red);
      color: #ffa0a0;
    }

    /* markdown styles inside bubble */
    .bubble h1, .bubble h2, .bubble h3 {
      margin: 12px 0 6px;
      color: var(--text);
    }
    .bubble p { margin-bottom: 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { padding-left: 20px; margin-bottom: 8px; }
    .bubble li { margin-bottom: 4px; }
    .bubble strong { color: #e6edf3; }
    .bubble code:not(pre code) {
      background: var(--surface);
      padding: 1px 6px;
      border-radius: 4px;
      font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
      font-size: 13px;
    }
    .bubble pre {
      margin: 8px 0;
      border-radius: 8px;
      overflow: hidden;
    }
    .bubble pre code {
      font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
      font-size: 13px;
    }

    /* typing indicator */
    .typing { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing span {
      width: 6px; height: 6px;
      background: var(--text-dim);
      border-radius: 50%;
      animation: bounce .9s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .30s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-6px); }
    }

    /* ── INPUT ───────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      background: var(--surface);
    }

    #form {
      display: flex;
      gap: 8px;
      max-width: 820px;
      margin: 0 auto;
    }

    #input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }

    #input:focus { border-color: var(--primary); }
    #input:disabled { opacity: .5; cursor: not-allowed; }
    #input::placeholder { color: var(--text-dim); }

    #send {
      background: var(--primary);
      color: #0d1117;
      border: none;
      border-radius: var(--radius);
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #send:hover { opacity: .85; }
    #send:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-title">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M4.22 4.22l2.12 2.12m11.32 11.32 2.12 2.12M2 12h3m14 0h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/>
    </svg>
    RAG Microservices
  </div>
  <div id="status">
    <span class="dot" id="dot"></span>
    <span id="status-text">Inicializando...</span>
  </div>
</header>

<!-- SUGESTÕES -->
<div class="suggestions">
  <label>Sugestões:</label>
  <button class="chip">O que é Circuit Breaker?</button>
  <button class="chip">Como funciona o padrão Saga?</button>
  <button class="chip">O que é CQRS?</button>
  <button class="chip">Explique o padrão Strangler Fig</button>
  <button class="chip">O que é API Gateway?</button>
  <button class="chip">Como funciona Service Discovery?</button>
  <button class="chip">O que é Event Sourcing?</button>
  <button class="chip">Como lidar com transações distribuídas?</button>
</div>

<!-- CHAT -->
<div id="chat"></div>

<!-- INPUT -->
<footer>
  <form id="form">
    <input id="input" placeholder="Aguarde, carregando modelos..." disabled autocomplete="off" />
    <button id="send" type="submit" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M22 2 11 13M22 2 15 22 11 13 2 9l20-7z"/>
      </svg>
      Enviar
    </button>
  </form>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script>
  const chat    = document.getElementById('chat')
  const form    = document.getElementById('form')
  const input   = document.getElementById('input')
  const send    = document.getElementById('send')
  const dot     = document.getElementById('dot')
  const statusT = document.getElementById('status-text')

  marked.setOptions({ breaks: true, gfm: true })

  // ── STATUS POLLING ───────────────────────────────────
  async function pollStatus() {
    try {
      const res  = await fetch('/api/status')
      const data = await res.json()

      if (data.ready) {
        dot.className = 'dot ready'
        statusT.textContent = 'Pronto'
        input.disabled = false
        send.disabled  = false
        input.placeholder = 'Faça uma pergunta sobre microservices...'
        input.focus()
        return // stop polling
      }

      if (data.error) {
        dot.className = 'dot error'
        statusT.textContent = 'Erro na inicialização'
        addMessage('bot', `❌ Erro: ${data.error}`, true)
        return // stop polling
      }
    } catch (_) { /* servidor ainda subindo */ }

    setTimeout(pollStatus, 2000)
  }

  // ── MENSAGENS ────────────────────────────────────────
  function addMessage(role, content, isError = false) {
    const msg = document.createElement('div')
    msg.className = `msg ${role}`

    const avatar = document.createElement('div')
    avatar.className = 'avatar'
    avatar.textContent = role === 'user' ? '👤' : '🤖'

    const bubble = document.createElement('div')
    bubble.className = `bubble${isError ? ' error' : ''}`

    if (role === 'bot' && !isError) {
      bubble.innerHTML = marked.parse(content)
      bubble.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el))
    } else {
      bubble.textContent = content
    }

    msg.appendChild(avatar)
    msg.appendChild(bubble)
    chat.appendChild(msg)
    chat.scrollTop = chat.scrollHeight
    return msg
  }

  function addTyping() {
    const msg = document.createElement('div')
    msg.className = 'msg bot'
    msg.id = 'typing'
    msg.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
    `
    chat.appendChild(msg)
    chat.scrollTop = chat.scrollHeight
  }

  function removeTyping() {
    document.getElementById('typing')?.remove()
  }

  // ── ENVIAR PERGUNTA ──────────────────────────────────
  async function ask(question) {
    addMessage('user', question)
    addTyping()
    input.value = ''
    input.disabled = true
    send.disabled  = true

    try {
      const res  = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      })
      const data = await res.json()
      removeTyping()

      if (data.error) {
        addMessage('bot', data.error, true)
      } else {
        addMessage('bot', data.answer)
      }
    } catch (err) {
      removeTyping()
      addMessage('bot', 'Erro de conexão com o servidor.', true)
    } finally {
      input.disabled = false
      send.disabled  = false
      input.focus()
    }
  }

  // ── EVENTOS ──────────────────────────────────────────
  form.addEventListener('submit', e => {
    e.preventDefault()
    const q = input.value.trim()
    if (q) ask(q)
  })

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      if (!input.disabled) ask(chip.textContent)
    })
  })

  // ── INIT ─────────────────────────────────────────────
  addMessage('bot', 'Olá! Sou especialista em **Microservices e Design Patterns**. Assim que o servidor terminar de carregar, pode fazer sua pergunta!')
  pollStatus()
</script>
</body>
</html>
